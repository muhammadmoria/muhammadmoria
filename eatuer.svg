<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.2" />
    </pattern>
    <linearGradient id="metallic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F8FF" />
      <stop offset="90%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="blur-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="blur-15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="huge-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
    <style>
      .txt-base {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 3px;
        text-anchor: middle;
      }
      .mono { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Volumetric Lighting -->
  <polygon points="400,90 800,90 700,160 500,160" fill="#7C3AED" opacity="0.15" filter="url(#huge-blur)" />
  <polygon points="450,90 750,90 650,160 550,160" fill="#00F5FF" opacity="0.15" filter="url(#huge-blur)" />

  <!-- Center Glass Panel -->
  <path d="M 350 50 H 850 Q 870 50 870 70 V 110 Q 870 130 850 130 H 350 Q 330 130 330 110 V 70 Q 330 50 350 50 Z" fill="url(#glass)" stroke="url(#cyan-purple)" stroke-width="1.5" filter="url(#glow)" />
  <path d="M 350 50 H 850" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5" />

  <!-- HUD Corner Elements -->
  <path d="M 10 60 L 10 10 L 60 10 M 10 30 L 30 30 L 30 10" fill="none" stroke="#00F5FF" stroke-width="2" filter="url(#glow)" />
  <path d="M 1190 60 L 1190 10 L 1140 10 M 1190 30 L 1170 30 L 1170 10" fill="none" stroke="#7C3AED" stroke-width="2" filter="url(#glow)" />
  <path d="M 10 120 L 10 170 L 60 170 M 10 150 L 30 150 L 30 170" fill="none" stroke="#7C3AED" stroke-width="2" filter="url(#glow)" />
  <path d="M 1190 120 L 1190 170 L 1140 170 M 1190 150 L 1170 150 L 1170 170" fill="none" stroke="#00F5FF" stroke-width="2" filter="url(#glow)" />

  <!-- Left Side Decor -->
  <g id="left-decor">
    <!-- AI Processor Chip -->
    <g transform="translate(80, 60)" filter="url(#glow)">
      <rect x="0" y="0" width="30" height="30" fill="none" stroke="#00F5FF" stroke-width="1.5" />
      <rect x="5" y="5" width="20" height="20" fill="none" stroke="#7C3AED" stroke-width="1" />
      <path d="M -5 10 H 0 M -5 15 H 0 M -5 20 H 0 M 30 10 H 35 M 30 15 H 35 M 30 20 H 35 M 10 -5 V 0 M 15 -5 V 0 M 20 -5 V 0 M 10 30 V 35 M 15 30 V 35 M 20 30 V 35" stroke="#00F5FF" stroke-width="1.5" />
      <circle cx="15" cy="15" r="3" fill="#FF00FF" />
    </g>

    <!-- Neural Network Nodes -->
    <g transform="translate(200, 50)" filter="url(#glow)">
      <line x1="0" y1="0" x2="20" y2="15" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <line x1="0" y1="0" x2="20" y2="30" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <line x1="20" y1="15" x2="40" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <line x1="20" y1="15" x2="40" y2="30" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <line x1="20" y1="30" x2="40" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <line x1="20" y1="30" x2="40" y2="30" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
      <circle cx="0" cy="0" r="3" fill="#00F5FF" />
      <circle cx="20" cy="15" r="3" fill="#FF00FF" />
      <circle cx="20" cy="30" r="3" fill="#00F5FF" />
      <circle cx="40" cy="0" r="3" fill="#00F5FF" />
      <circle cx="40" cy="30" r="3" fill="#00F5FF" />
    </g>

    <!-- Database Cylinder -->
    <g transform="translate(300, 120)" filter="url(#glow)">
      <ellipse cx="0" cy="-10" rx="15" ry="5" fill="none" stroke="#FF8A00" stroke-width="2" />
      <path d="M -15 -10 V 10 A 15 5 0 0 0 15 10 V -10" fill="none" stroke="#FF8A00" stroke-width="2" />
      <path d="M -15 0 A 15 5 0 0 0 15 0" fill="none" stroke="#FF8A00" stroke-width="1" opacity="0.5" />
      <path d="M -15 5 A 15 5 0 0 0 15 5" fill="none" stroke="#FF8A00" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Git Branch -->
    <g transform="translate(150, 130)" filter="url(#glow)">
      <circle cx="0" cy="0" r="5" fill="none" stroke="#FFD700" stroke-width="1.5" />
      <circle cx="0" cy="25" r="5" fill="none" stroke="#FFD700" stroke-width="1.5" />
      <circle cx="20" cy="25" r="5" fill="none" stroke="#FFD700" stroke-width="1.5" />
      <path d="M 0 5 V 20 M 0 25 H 15" fill="none" stroke="#FFD700" stroke-width="1.5" />
    </g>

    <!-- Rocket Trail -->
    <path d="M 300 160 L 250 110" stroke="#FF8A00" stroke-width="2" stroke-dasharray="5 5" filter="url(#glow)" />
    <circle cx="250" cy="110" r="4" fill="#FFD700" filter="url(#strong-glow)" />

    <!-- Hexagonal Mesh -->
    <polygon points="20,0 40,11.5 40,34.5 20,46 0,34.5 0,11.5" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3" transform="translate(60, 80)" />
    <polygon points="20,0 40,11.5 40,34.5 20,46 0,34.5 0,11.5" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.3" transform="translate(100, 120)" />

    <!-- Floating Code Snippets -->
    <text x="280" y="100" class="mono" font-size="20" fill="#00FFC6" opacity="0.8" filter="url(#glow)">&lt;/&gt;</text>
    <text x="400" y="30" class="mono" font-size="10" fill="#00F5FF" opacity="0.6">npm run build</text>
    <text x="150" y="40" class="mono" font-size="9" fill="#FFD700" opacity="0.5">10101001</text>

    <!-- Circuit Traces -->
    <path d="M 50 90 L 120 90 L 150 120" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />
    <circle cx="50" cy="90" r="2" fill="#00F5FF" />
    <path d="M 100 150 L 200 150 L 250 110" fill="none" stroke="#00FFC6" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />

    <!-- Data Widgets -->
    <rect x="100" y="100" width="40" height="5" fill="#00F5FF" opacity="0.8" />
    <rect x="100" y="108" width="25" height="5" fill="#7C3AED" opacity="0.8" />

    <!-- Tiny Crosses & Matrix Dots -->
    <path d="M 400 140 v 6 M 403 143 h -6" stroke="#00FFC6" stroke-width="1" filter="url(#glow)" />
    <circle cx="450" cy="50" r="1.5" fill="#00F5FF" />
    <circle cx="180" cy="150" r="1.5" fill="#FF00FF" />
  </g>

  <!-- Right Side Decor -->
  <g id="right-decor">
    <!-- Analytics Dashboard -->
    <g transform="translate(1000, 40)" filter="url(#glow)">
      <rect x="0" y="0" width="60" height="40" rx="4" fill="url(#glass)" stroke="#00FFC6" stroke-width="1" />
      <rect x="8" y="20" width="8" height="12" fill="#00FFC6" opacity="0.8" />
      <rect x="20" y="12" width="8" height="20" fill="#00F5FF" opacity="0.8" />
      <rect x="32" y="25" width="8" height="7" fill="#FF00FF" opacity="0.8" />
      <polyline points="4,14 18,20 30,8 44,15 56,10" fill="none" stroke="#FFD700" stroke-width="1.5" />
    </g>

    <!-- Terminal Window -->
    <g transform="translate(1020, 110)" filter="url(#glow)">
      <rect x="0" y="0" width="80" height="45" rx="4" fill="url(#glass)" stroke="#7C3AED" stroke-width="1" />
      <circle cx="10" cy="8" r="2.5" fill="#FF00FF" />
      <circle cx="18" cy="8" r="2.5" fill="#FFD700" />
      <circle cx="26" cy="8" r="2.5" fill="#00FFC6" />
      <path d="M 10 25 L 16 30 L 10 35" fill="none" stroke="#00F5FF" stroke-width="1.5" />
      <line x1="20" y1="35" x2="35" y2="35" stroke="#00F5FF" stroke-width="1.5" />
    </g>

    <!-- Docker / Kubernetes Container -->
    <g transform="translate(1080, 100)" filter="url(#glow)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#00F5FF" stroke-width="1" />
      <rect x="14" y="0" width="12" height="12" fill="none" stroke="#00F5FF" stroke-width="1" />
      <rect x="28" y="0" width="12" height="12" fill="none" stroke="#00F5FF" stroke-width="1" />
      <rect x="14" y="14" width="12" height="12" fill="none" stroke="#00F5FF" stroke-width="1" />
      <path d="M -5 28 H 45 C 45 22 40 20 35 20 C 35 15 25 15 25 22 H 5 C 0 22 -5 24 -5 28 Z" fill="url(#glass)" stroke="#3B82F6" stroke-width="1" />
    </g>

    <!-- API Endpoints / Cloud -->
    <g transform="translate(950, 90)" filter="url(#glow)">
      <path d="M 10 20 A 10 10 0 0 1 10 0 H 30 A 10 10 0 0 1 30 20 Z" fill="none" stroke="#00F5FF" stroke-width="1.5" />
      <circle cx="20" cy="10" r="3" fill="#00F5FF" />
    </g>

    <!-- Hexagonal Mesh -->
    <polygon points="20,0 40,11.5 40,34.5 20,46 0,34.5 0,11.5" fill="none" stroke="#FF00FF" stroke-width="1" opacity="0.3" transform="translate(1090, 50)" />
    <polygon points="20,0 40,11.5 40,34.5 20,46 0,34.5 0,11.5" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3" transform="translate(1130, 90)" />

    <!-- Floating Cube -->
    <g transform="translate(1100, 130)" filter="url(#glow)">
      <polygon points="0,0 10,5 0,10 -10,5" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.8" />
      <polygon points="0,0 10,5 10,15 0,10" fill="url(#glass)" stroke="#FFD700" stroke-width="1" />
      <polygon points="0,0 -10,5 -10,15 0,10" fill="none" stroke="#FFD700" stroke-width="1" />
    </g>

    <!-- Floating Code Snippets -->
    <text x="880" y="100" class="mono" font-size="20" fill="#FF8A00" opacity="0.8" filter="url(#glow)">{ }</text>
    <text x="750" y="160" class="mono" font-size="10" fill="#7C3AED" opacity="0.6">git push origin</text>
    <text x="950" y="170" class="mono" font-size="9" fill="#00FFC6" opacity="0.5">11010110</text>

    <!-- Circuit Traces -->
    <path d="M 1150 90 L 1080 90 L 1050 120" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />
    <circle cx="1150" cy="90" r="2" fill="#00F5FF" />
    <path d="M 1100 150 L 1000 150 L 950 110" fill="none" stroke="#00FFC6" stroke-width="1.5" opacity="0.8" filter="url(#glow)" />

    <!-- Data Widgets -->
    <rect x="1060" y="100" width="40" height="5" fill="#FF00FF" opacity="0.8" />
    <rect x="1075" y="108" width="25" height="5" fill="#FF8A00" opacity="0.8" />

    <!-- Tiny Crosses & Matrix Dots -->
    <path d="M 800 140 v 6 M 803 143 h -6" stroke="#FF00FF" stroke-width="1" filter="url(#glow)" />
    <circle cx="850" cy="50" r="1.5" fill="#00F5FF" />
    <circle cx="1020" cy="150" r="1.5" fill="#FFD700" />
  </g>

  <!-- Center Energy Rings -->
  <circle cx="600" cy="0" r="40" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.3" stroke-dasharray="2 4" filter="url(#glow)" />
  <circle cx="600" cy="180" r="40" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3" stroke-dasharray="2 4" filter="url(#glow)" />

  <!-- Typography -->
  <text x="600" y="115" class="txt-base" fill="#7C3AED" opacity="0.6" filter="url(#blur-15)">🚀 Featured Projects</text>
  <text x="600" y="115" class="txt-base" fill="#00F5FF" opacity="0.8" filter="url(#blur-5)">🚀 Featured Projects</text>
  <text x="600" y="115" class="txt-base" fill="url(#metallic)" stroke="#3B82F6" stroke-width="1.5">🚀 Featured Projects</text>
</svg>