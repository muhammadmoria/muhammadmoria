<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="1" fill="#00F5FF" fill-opacity="0.3"/>
    </pattern>

    <!-- Hexagonal Mesh Pattern -->
    <pattern id="hex-mesh" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="180" fill="url(#grid)" />
  <rect width="1200" height="180" fill="url(#hex-mesh)" />

  <!-- HUD Interface Corners -->
  <g fill="none" stroke="#00F5FF" stroke-width="2.5" filter="url(#glow-soft)">
    <path d="M 40 40 L 20 40 L 20 20 L 40 20" />
    <path d="M 1160 40 L 1180 40 L 1180 20 L 1160 20" />
    <path d="M 40 140 L 20 140 L 20 160 L 40 160" />
    <path d="M 1160 140 L 1180 140 L 1180 160 L 1160 160" />
  </g>
  
  <!-- Laser Scan Lines & Pulse Lines -->
  <rect x="0" y="5" width="1200" height="1.5" fill="#00F5FF" fill-opacity="0.4" filter="url(#glow-soft)" />
  <rect x="0" y="173.5" width="1200" height="1.5" fill="#00F5FF" fill-opacity="0.4" filter="url(#glow-soft)" />
  <line x1="0" y1="45" x2="1200" y2="45" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="80 120 30 200" />
  <line x1="0" y1="135" x2="1200" y2="135" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="120 80 200 40" />

  <!-- Fiber Optic Light Trails -->
  <path d="M -50 120 Q 300 200 600 120 T 1250 120" fill="none" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 6" filter="url(#glow-soft)" />
  <path d="M -50 60 Q 300 -20 600 60 T 1250 60" fill="none" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 6" filter="url(#glow-soft)" />

  <!-- Central HUD & Energy Rings -->
  <circle cx="600" cy="90" r="100" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <circle cx="600" cy="90" r="120" fill="none" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="10 20" stroke-opacity="0.2" />
  <line x1="600" y1="0" x2="600" y2="40" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.5" />
  <line x1="600" y1="140" x2="600" y2="180" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.5" />

  <!-- Left Side: AI Network Hub & Neural Connections -->
  <g id="left-network" filter="url(#glow-soft)">
    <!-- Energy Rings -->
    <circle cx="150" cy="90" r="35" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.8" />
    <circle cx="150" cy="90" r="45" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.6" />
    <circle cx="150" cy="55" r="2.5" fill="#FF8A00" /> <!-- Orbiting satellite -->
    <rect x="147" y="52" width="6" height="2" fill="#FF8A00" />

    <!-- Neural Network Nodes -->
    <circle cx="120" cy="60" r="4" fill="#00F5FF" filter="url(#glow-strong)" />
    <circle cx="180" cy="120" r="3" fill="#FF00FF" filter="url(#glow-strong)" />
    <circle cx="250" cy="80" r="5" fill="#3B82F6" filter="url(#glow-strong)" />
    <circle cx="300" cy="130" r="2.5" fill="#00FFC6" filter="url(#glow-strong)" />
    <path d="M 120 60 Q 160 90 180 120 T 250 80 T 300 130" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Data Packets -->
    <circle cx="160" cy="90" r="2" fill="#FFFFFF" filter="url(#glow-strong)" />
    <circle cx="225" cy="105" r="2" fill="#FFFFFF" filter="url(#glow-strong)" />
    
    <!-- Circuit Traces -->
    <path d="M 70 90 L 90 90 L 90 120 L 110 120" fill="none" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.6" />
    <path d="M 40 140 L 80 140 L 100 160" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Left Side: Cloud & Database Icons -->
  <g id="left-icons" filter="url(#glow-soft)">
    <!-- Database Symbol -->
    <g transform="translate(80, 140)">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#00FFC6" stroke-width="1.5" />
      <path d="M -10 0 V 8 A 10 4 0 0 0 10 8 V 0" fill="none" stroke="#00FFC6" stroke-width="1.5" />
      <path d="M -10 4 A 10 4 0 0 0 10 4" fill="none" stroke="#00FFC6" stroke-width="1" stroke-opacity="0.5" />
    </g>
    <!-- Cloud Computing Icon -->
    <g transform="translate(330, 50)">
      <path d="M 5 15 A 5 5 0 0 1 5 5 A 7 7 0 0 1 19 8 A 4 4 0 0 1 19 15 Z" fill="none" stroke="#FF8A00" stroke-width="1.5" />
      <line x1="8" y1="18" x2="16" y2="18" stroke="#FF8A00" stroke-width="1.5" />
    </g>
    <!-- Encrypted Lock Icon -->
    <g transform="translate(260, 40)">
      <rect x="0" y="6" width="12" height="9" rx="1" fill="none" stroke="#00FFC6" stroke-width="1.5" />
      <path d="M 2 6 V 4 A 4 4 0 0 1 10 4 V 6" fill="none" stroke="#00FFC6" stroke-width="1.5" />
      <circle cx="6" cy="10.5" r="1.2" fill="#00FFC6" />
    </g>
  </g>

  <!-- Left Side: API Connection to Center -->
  <g filter="url(#glow-soft)">
    <path d="M 100 140 C 200 140, 300 100, 425 90" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.8" />
    <polygon points="425,90 417,86 417,94" fill="#00F5FF" />
  </g>

  <!-- Right Side: Cyber Communication Panels -->
  <g id="right-network" filter="url(#glow-soft)">
    <!-- Internet Globe Wireframe -->
    <circle cx="1050" cy="60" r="30" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.9" />
    <ellipse cx="1050" cy="60" rx="30" ry="12" fill="none" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="1050" cy="60" rx="12" ry="30" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1020 60 A 30 30 0 0 0 1080 60" fill="none" stroke="#7C3AED" stroke-width="1.5" />
    <path d="M 1050 30 Q 1035 60 1050 90" fill="none" stroke="#00FFC6" stroke-width="1" />
    <path d="M 1050 30 Q 1065 60 1050 90" fill="none" stroke="#00FFC6" stroke-width="1" />

    <!-- Server Racks -->
    <g transform="translate(960, 110)">
      <rect x="0" y="0" width="80" height="12" rx="2" fill="none" stroke="#00F5FF" stroke-width="1.5" />
      <rect x="0" y="16" width="80" height="12" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="6" cy="6" r="1.5" fill="#00FFC6" filter="url(#glow-strong)" />
      <circle cx="6" cy="22" r="1.5" fill="#FF8A00" filter="url(#glow-strong)" />
      <line x1="14" y1="3" x2="70" y2="3" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.6" />
      <line x1="14" y1="19" x2="70" y2="19" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Wireless Signal Waves -->
    <path d="M 950 40 Q 960 30 970 40" fill="none" stroke="#FF00FF" stroke-width="1.5" filter="url(#glow-soft)" />
    <path d="M 945 45 Q 960 25 975 45" fill="none" stroke="#FF00FF" stroke-width="1" filter="url(#glow-soft)" />

    <!-- Nodes & Data Transfer -->
    <circle cx="900" cy="70" r="3" fill="#FF00FF" filter="url(#glow-strong)" />
    <circle cx="950" cy="100" r="4" fill="#3B82F6" filter="url(#glow-strong)" />
    <path d="M 900 70 Q 925 85 950 100" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <!-- Right Side: API Connection to Center -->
  <g filter="url(#glow-soft)">
    <path d="M 1100 40 C 1000 40, 900 80, 775 90" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.8" />
    <polygon points="775,90 783,86 783,94" fill="#7C3AED" />
  </g>

  <!-- Network Analytics Widgets -->
  <g id="analytics" filter="url(#glow-soft)">
    <!-- Left Widget -->
    <rect x="80" y="30" width="60" height="20" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.8" rx="2"/>
    <line x1="85" y1="38" x2="120" y2="38" stroke="#00F5FF" stroke-width="1.5" />
    <line x1="85" y1="43" x2="110" y2="43" stroke="#00F5FF" stroke-width="1.5" />
    <circle cx="125" cy="40" r="2" fill="#00FFC6" />
    <!-- Right Widget -->
    <rect x="1060" y="130" width="60" height="20" fill="none" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.8" rx="2"/>
    <line x1="1065" y1="138" x2="1100" y2="138" stroke="#FF00FF" stroke-width="1.5" />
    <line x1="1065" y1="143" x2="1090" y2="143" stroke="#FF00FF" stroke-width="1.5" />
    <circle cx="1105" cy="140" r="2" fill="#FF8A00" />
  </g>

  <!-- Hexagonal Mesh Details & Crosses -->
  <g stroke="#7C3AED" stroke-width="1" stroke-opacity="0.6" fill="none">
    <polygon points="40,90 50,80 60,80 70,90 60,100 50,100" />
    <polygon points="1140,90 1150,80 1160,80 1170,90 1160,100 1150,100" />
  </g>
  <g stroke="#00F5FF" stroke-width="1" filter="url(#glow-soft)">
    <path d="M 50 85 L 50 89 M 48 87 L 52 87" />
    <path d="M 1150 85 L 1150 89 M 1148 87 L 1152 87" />
    <path d="M 300 50 L 300 54 M 298 52 L 302 52" />
    <path d="M 900 130 L 900 134 M 898 132 L 902 132" />
  </g>

  <!-- Glassmorphism Panel Behind Heading -->
  <g id="glass-panel">
    <path d="M 450 45 L 750 45 L 775 65 L 775 115 L 750 135 L 450 135 L 425 115 L 425 65 Z" fill="#050816" fill-opacity="0.6" stroke="#00F5FF" stroke-width="1.5" filter="url(#glow-soft)" />
    <path d="M 450 45 L 750 45 L 775 65 L 775 70 L 450 70 L 425 65 Z" fill="#00F5FF" fill-opacity="0.1" />
    <line x1="450" y1="55" x2="750" y2="55" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" />
    <line x1="450" y1="125" x2="750" y2="125" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" />
    <!-- Panel Corner Crosses -->
    <g stroke="#00F5FF" stroke-width="1" filter="url(#glow-soft)">
      <path d="M 460 50 L 460 56 M 457 53 L 463 53" />
      <path d="M 740 50 L 740 56 M 737 53 L 743 53" />
      <path d="M 460 124 L 460 130 M 457 127 L 463 127" />
      <path d="M 740 124 L 740 130 M 737 127 L 743 127" />
    </g>
    <!-- Data Arrows -->
    <path d="M 425 90 L 390 90" stroke="#00FFC6" stroke-width="2" filter="url(#glow-soft)" />
    <polygon points="390,90 396,87 396,93" fill="#00FFC6" filter="url(#glow-strong)" />
    <path d="M 775 90 L 810 90" stroke="#FF8A00" stroke-width="2" filter="url(#glow-soft)" />
    <polygon points="810,90 804,87 804,93" fill="#FF8A00" filter="url(#glow-strong)" />
  </g>

  <!-- Tech Readouts -->
  <text x="600" y="25" font-family="'Arial', sans-serif" font-size="9" fill="#00F5FF" fill-opacity="0.9" text-anchor="middle" letter-spacing="3" font-weight="bold">// SYSTEM_NETWORK_LINK //</text>
  <text x="600" y="160" font-family="'Arial', sans-serif" font-size="9" fill="#00FFC6" fill-opacity="0.9" text-anchor="middle" letter-spacing="3" font-weight="bold">STATUS: ONLINE [ ENCRYPTED ]</text>

  <!-- Main Heading: 🌐 Connect -->
  <g id="heading-text">
    <!-- Outer Neon Cyan Glow -->
    <text x="600" y="90" font-family="'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="56" text-anchor="middle" dominant-baseline="central" letter-spacing="3" fill="none" stroke="#00F5FF" stroke-width="4" opacity="0.5" filter="url(#glow-strong)">🌐 Connect</text>
    <!-- Electric Blue Edge Lighting -->
    <text x="600" y="90" font-family="'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="56" text-anchor="middle" dominant-baseline="central" letter-spacing="3" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.9">🌐 Connect</text>
    <!-- Crisp White Metallic Core -->
    <text x="600" y="90" font-family="'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="56" text-anchor="middle" dominant-baseline="central" letter-spacing="3" fill="#FFFFFF" stroke="#050816" stroke-width="0.5">🌐 Connect</text>
  </g>
</svg>